minimum_pre_commit_version: "4.0.0"
default_install_hook_types:
  - pre-push
default_stages:
  - pre-push
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: node scripts/run_python_in_venv.js -m ruff check .
        language: system
        pass_filenames: false
      - id: black-check
        name: black --check
        entry: node scripts/run_python_in_venv.js -m black --check .
        language: system
        pass_filenames: false
      - id: flake8
        name: flake8
        entry: node scripts/run_python_in_venv.js -m flake8 .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: node scripts/run_python_in_venv.js -m mypy src
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: node scripts/run_python_in_venv.js -m pytest
        language: system
        pass_filenames: false
