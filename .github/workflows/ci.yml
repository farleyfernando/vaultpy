name: CI

on:
  push:
    branches: ["main", "master"]
    paths-ignore: ["badges/**"]
  pull_request:
    paths-ignore: ["badges/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Ruff
        run: python -m ruff check .
      - name: Black
        run: python -m black --check .
      - name: Flake8
        run: python -m flake8 .
      - name: MyPy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest --junitxml=pytest-report.xml --cov-report=json:coverage.json
      - name: Generate CI badges
        run: python scripts/update_ci_badges.py --junitxml pytest-report.xml --coveragejson coverage.json --output badges
      - name: Commit CI badges
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/tests.svg badges/coverage.svg
          git diff --cached --quiet || git commit -m "Update CI badges"
          git push
